# CI del repositorio central: autotest del producto B y trazabilidad con A.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: python -m pip install --disable-pip-version-check ".[test]"
      - name: Autotests (pytest)
        run: python -m pytest -q
      - name: Matriz de trazabilidad estricta
        # El CLI se instala en site-packages, que no incluye tests/fixtures: hay que apuntar al del repo.
        run: harness matrix --strict --fixtures tests/fixtures --output MATRIZ.md
      - name: La matriz versionada está al día
        run: diff -u docs/MATRIZ.md MATRIZ.md
      - name: El ejemplo greenfield es conforme
        run: harness check --path examples/greenfield --run-commands --strict
