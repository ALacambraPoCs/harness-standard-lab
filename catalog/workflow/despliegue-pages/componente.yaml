id: despliegue-pages
tipo: workflow
version: 0.1.0
estado: experimental
titulo: Despliegue en GitHub Pages con verificación, rollback y auditoría
proposito: >-
  Workflow de GitHub Actions que despliega en GitHub Pages lo que se fusiona en la rama por defecto,
  verifica que la URL sirve exactamente ese SHA y, si no, vuelve a desplegar la versión que se servía
  antes y abre una issue. Admite rollback manual a cualquier SHA de la historia de la rama por defecto
  y deja en el resumen del run el rastro de `harness audit`.
propietario: "@AlbertoLacambra"
compatibilidad:
  adaptadores: [neutro]
  niveles: [N1, N2, N3]
contrato:
  entradas:
    - "Push a la rama por defecto, o workflow_dispatch desde ella con `sha` (rollback manual)"
    - "Directorio del sitio estático ya generado y versionado (ORIGEN_SITIO, por defecto site/); no se ejecuta código del commit"
    - "Variable de repositorio opcional HARNESS_PAGES_URL (por defecto https://<dueño>.github.io/<repo>/)"
  salidas:
    - "Sitio publicado con version.txt = SHA desplegado"
    - "Run en verde solo si la URL sirve el SHA objetivo; en rojo si hubo que revertir"
    - "Issue «Despliegue fallido …» si la verificación falla, con el resultado del rollback"
    - "Resumen del run con `harness audit <sha>` (PR, tarea, origen, riesgo, checks, aprobaciones, despliegues)"
  efectos:
    - "Despliega en el environment github-pages (jobs desplegar y revertir: pages y id-token en escritura)"
    - "Abre una issue si el despliegue no se verifica (job avisar: issues en escritura)"
permisos:
  herramientas: []
  escritura: []
  red: [api.github.com, "*.github.io"]
  secretos: false
control:
  es_control: true
  capa: L4
  determinista: true
archivos:
  - origen: src/despliegue-pages.yml
    destino: .github/workflows/despliegue-pages.yml
  - origen: src/despliegue.py
    destino: .harness/despliegue/despliegue.py
  - origen: src/RUNBOOK-rollback.md
    destino: docs/runbooks/rollback-pages.md
dependencias: []
pruebas:
  - tipo: unitaria
    descripcion: "construir no ejecuta código, rechaza enlaces, rutas fuera del sitio y version.txt propio; preparar solo acepta la rama por defecto y SHA de su historia; verificar reintenta y falla al agotar el tiempo; el workflow cumple HS-CI-007/008 y solo desplegar/revertir pueden desplegar"
    comando: "python -m pytest catalog/workflow/despliegue-pages/tests"
  - tipo: integracion
    descripcion: "F5.7 en harness-example-greenfield: despliegue verificado; despliegue roto (verificación fallida) con rollback automático e issue; rollback manual por SHA; despliegue desde otra rama bloqueado por el environment"
metricas:
  - "Despliegues verificados / despliegues (objetivo: 100 % salvo fallos reales)"
  - "Tiempo de merge a sitio verificado (p50, p95)"
  - "Rollbacks automáticos y manuales; tiempo hasta servir de nuevo la versión anterior"
  - "Alertas de `harness audit` en commits desplegados (objetivo: 0)"
coste:
  contexto: "Nulo: no usa agentes"
  latencia: "2–12 minutos por despliegue (la verificación espera a la caché de Pages, máx. 10 min)"
riesgos:
  - "La caché de Pages puede retrasar la verificación; con un tiempo de espera corto daría falsos rollbacks"
  - "El rollback automático vuelve a lo que se servía antes: si eso ya estaba roto, la issue lo dice y se sigue el runbook"
  - "Sitios que necesitan compilarse: el componente no ejecuta código del commit; se generan y versionan antes (o se amplía con un ADR)"
  - "Un administrador puede saltarse la política de ramas del environment: se comprueba con harness platform check"
retirada:
  condicion: "Si el equipo pasa a otra plataforma de despliegue o a un workflow de despliegue propio con verificación y rollback equivalentes"
  procedimiento: "harness components remove despliegue-pages (borra el workflow, .harness/despliegue/ y el runbook) y desactiva Pages"
ficha: FICHA.md
