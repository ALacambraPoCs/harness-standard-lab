[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "harness-standard-cli"
version = "0.5.1rc1"
description = "CLI de conformidad del Estándar de Harness (producto B)"
readme = "tools/harness-cli/README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
harness = "harness_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tools/harness-cli/src/harness_cli"]

[tool.hatch.build.targets.wheel.force-include]
"standard/requirements.yaml" = "harness_cli/_standard/standard/requirements.yaml"
"standard/roles.yaml" = "harness_cli/_standard/standard/roles.yaml"
"standard/VERSION" = "harness_cli/_standard/standard/VERSION"
"schemas" = "harness_cli/_standard/schemas"
"catalog" = "harness_cli/_standard/catalog"

[tool.pytest.ini_options]
testpaths = ["tests", "catalog"]
norecursedirs = ["tests/fixtures"]
pythonpath = ["tools/harness-cli/src"]
