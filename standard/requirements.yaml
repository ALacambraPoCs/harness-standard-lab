# Registro de requisitos del Estándar de Harness.
# Fuente de verdad normativa (ADR-002). Validado por schemas/requirement.schema.json.
# Si la prosa de standard/*.md discrepa de este archivo, prevalece este archivo.
version_estandar: 0.7.0
# Niveles con requisitos especificados en esta versión. Declarar otro nivel es un error (HS-GOV-002).
niveles_definidos: [N0, N1]
# Versión del estándar desde la que existe cada nivel (D-029). N1 exige declarar `standard.version` ≥ 0.2.0.
niveles_desde: {N0: 0.1.0, N1: 0.2.0}
requisitos:

  # ───────────────────────── GOBIERNO ─────────────────────────
  - id: HS-GOV-001
    titulo: Existe un manifiesto de instancia válido
    texto: >-
      La instancia DEBE contener `.harness/manifest.yaml` y este DEBE validar contra
      `schemas/manifest.schema.json`.
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [core.manifest.valid]
    fuentes: [decision-propia, ADR-004]
    estado: aprobado
    desde: 0.1.0
    retirada: Si la conformidad pasa a declararse en un sistema externo versionado equivalente.

  - id: HS-GOV-002
    titulo: El manifiesto declara una versión soportada del estándar y un nivel definido
    texto: >-
      `standard.version` DEBE ser una versión SemVer del estándar publicada y soportada
      por la versión de la CLI que la valida, y `standard.level` DEBE ser un nivel con
      requisitos definidos en esa versión.
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [core.manifest.standard-version]
    fuentes: [decision-propia, ADR-001]
    estado: aprobado
    desde: 0.1.0
    retirada: Nunca mientras exista versionado del estándar.

  - id: HS-GOV-003
    titulo: Los waivers son válidos y están vigentes
    texto: >-
      Cada waiver DEBE referirse a un requisito existente y exentable, DEBE indicar motivo,
      aprobador, fecha de aprobación y caducidad, NO DEBE superar 90 días entre aprobación
      y caducidad y NO DEBE estar caducado.
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [core.waivers.valid]
    fuentes: [decision-propia, ADR-007]
    estado: aprobado
    desde: 0.1.0
    retirada: Si se sustituye por un registro de excepciones centralizado.

  - id: HS-GOV-004
    titulo: La CI ejecuta el check de conformidad en cada PR como check requerido
    texto: >-
      Un workflow de la instancia DEBE ejecutar `harness check` (directamente o mediante el
      workflow reutilizable `harness-conformance.yml`) en `pull_request`, y el ruleset de la rama
      principal DEBE exigirlo como status check requerido.
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: enforcement
    verificacion: semiautomatica
    verificacion_manual: >-
      Hasta la Fase 5, el propietario de la instancia confirma en el ruleset de GitHub que el
      check es requerido. La regla automática solo comprueba que el workflow existe y se dispara en PR.
    exentable: false
    reglas: [core.ci.conformance-workflow]
    fuentes: [S-GH, ADR-009]
    estado: aprobado
    desde: 0.1.0
    retirada: Nunca mientras la conformidad se compruebe en CI.

  - id: HS-GOV-005
    titulo: Todo requisito de enforcement está respaldado por un control L4 o L5
    texto: >-
      Cada requisito del estándar con `naturaleza: enforcement` DEBE estar respaldado por al menos
      un control de CI (L4) o de plataforma (L5). Los hooks `prompt` o `agent` NO DEBEN contarse como control.
    nivel: DEBE
    ambito: estandar
    conformidad: []
    naturaleza: enforcement
    verificacion: manual
    verificacion_manual: Lo revisa el grupo de gobierno en cada cambio normativo (GOVERNANCE.md §2).
    exentable: false
    reglas: []
    fuentes: [S-CC-MEM, S-VILA, ADR-009]
    estado: aprobado
    desde: 0.1.0
    retirada: Nunca.

  - id: HS-GOV-006
    titulo: Solo se reubican roles reubicables y hacia rutas existentes
    texto: >-
      Cada entrada de `roles` del manifiesto DEBE referirse a un rol registrado en `roles.yaml`
      con `reubicable: true` y DEBE apuntar a una ruta existente del tipo correcto (archivo o directorio).
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [core.roles.relocation]
    fuentes: [decision-propia, ADR-004]
    estado: aprobado
    desde: 0.1.0
    retirada: Si se elimina la reubicación de roles.

  # ───────────────────────── INSTRUCCIONES ─────────────────────────
  - id: HS-INS-001
    titulo: Existe AGENTS.md en la raíz
    texto: La instancia DEBE tener un archivo `AGENTS.md` en la raíz del repositorio (rol `instructions.root`).
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: false
    reglas: [core.instructions.root-exists]
    fuentes: [S-AGENTSMD, S-OAI-HE#p5, ADR-003]
    estado: aprobado
    desde: 0.1.0
    retirada: Si AGENTS.md deja de ser un formato soportado por los adaptadores de la organización.

  - id: HS-INS-002
    titulo: AGENTS.md cita los comandos canónicos del manifiesto
    texto: >-
      `AGENTS.md` raíz DEBE contener, literalmente, las invocaciones de `setup`, `check` y `test`
      declaradas en `commands` del manifiesto.
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.instructions.commands-match]
    fuentes: [S-LHE#L02, decision-propia, ADR-006]
    estado: aprobado
    desde: 0.1.0
    retirada: Si los adaptadores inyectan los comandos del manifiesto automáticamente en el contexto.

  - id: HS-INS-004
    titulo: Las instrucciones no contienen estado de tareas
    texto: >-
      Los archivos de instrucciones (AGENTS.md, CLAUDE.md, reglas, skills) NO DEBEN contener estado
      de tareas (progreso, pendientes, bloqueos); este vive en los archivos de tarea (ADR-005).
    nivel: NO DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: manual
    verificacion_manual: Revisión en PR por CODEOWNERS de instrucciones (HS-SEC-002).
    exentable: true
    reglas: []
    fuentes: [S-OAI-HE#p5, S-LHE#L04, ADR-005]
    estado: aprobado
    desde: 0.1.0
    retirada: Nunca.

  - id: HS-INS-005
    titulo: Imports y enlaces de las instrucciones se resuelven
    texto: >-
      Todos los `@imports` (p. ej. `@AGENTS.md`) y enlaces Markdown relativos de los archivos
      AGENTS.md y CLAUDE.md DEBEN resolverse a rutas existentes del repositorio.
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.instructions.references-resolve]
    fuentes: [S-CC-MEM, S-VILA#p20]
    estado: aprobado
    desde: 0.1.0
    retirada: Si las herramientas fallan de forma visible ante imports rotos.

  - id: HS-INS-006
    titulo: CLAUDE.md importa AGENTS.md (adaptador claude-code)
    texto: >-
      Si el manifiesto declara el adaptador `claude-code`, DEBE existir `CLAUDE.md` en la raíz y
      DEBE contener una línea `@AGENTS.md` fuera de bloques de código.
    nivel: DEBE
    ambito: instancia
    adaptador: claude-code
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: false
    reglas: [adapter.claude.imports-agents]
    fuentes: [S-CC-MEM#agents-md, ADR-003]
    estado: aprobado
    desde: 0.1.0
    retirada: Si Claude Code carga AGENTS.md de forma incondicional en todas sus superficies.

  - id: HS-INS-007
    titulo: CLAUDE.md no duplica AGENTS.md (adaptador claude-code)
    texto: >-
      `CLAUDE.md` NO DEBE repetir encabezados ni líneas sustantivas de `AGENTS.md`; solo PUEDE
      añadir contenido exclusivo de Claude Code.
    nivel: NO DEBE
    ambito: instancia
    adaptador: claude-code
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [adapter.claude.no-duplication]
    fuentes: [S-LHE#L04, ADR-003]
    estado: aprobado
    desde: 0.1.0
    retirada: Nunca.

  - id: HS-INS-008
    titulo: AGENTS.md enlaza a los documentos núcleo
    texto: >-
      `AGENTS.md` raíz DEBERÍA enlazar (enlace Markdown relativo) al mapa de arquitectura, al registro
      de decisiones y a la política de seguridad. Es aceptable omitir un enlace si su contenido está
      resumido en el propio AGENTS.md y el documento no existe por waiver.
    nivel: DEBERÍA
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.instructions.links-core-docs]
    fuentes: [S-OAI-HE#p5, S-LHE#L04]
    estado: aprobado
    desde: 0.1.0
    retirada: Si la CLI genera el índice de AGENTS.md automáticamente.

  # ───────────────────────── CONTEXTO ─────────────────────────
  - id: HS-CTX-001
    titulo: Presupuesto de tamaño de las instrucciones
    texto: >-
      Cada archivo AGENTS.md o CLAUDE.md DEBERÍA tener como máximo `budgets.instructions_max_lines`
      líneas (200 por defecto, ajustable en el manifiesto). Es aceptable superarlo transitoriamente
      durante la adopción de un brownfield, con waiver.
    nivel: DEBERÍA
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.instructions.size-budget]
    fuentes: [S-CC-MEM, S-OAI-HE#p5, ADR-009]
    nota: El umbral es un valor por defecto ajustable; la evidencia sobre el óptimo es débil (F0-01, C4).
    estado: aprobado
    desde: 0.1.0
    retirada: Si las evaluaciones del harness (Fase 6) muestran que el tamaño no afecta a calidad ni coste.

  # ───────────────────────── ARQUITECTURA ─────────────────────────
  - id: HS-ARC-001
    titulo: Existe el mapa de arquitectura
    texto: La instancia DEBE tener un mapa de arquitectura (rol `architecture.map`).
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.architecture.map-exists]
    fuentes: [S-OAI-HE#p6, S-LHE#L03]
    nota: El contenido mínimo se especifica en la ficha de la Fase 2.
    estado: aprobado
    desde: 0.1.0
    retirada: Nunca.

  - id: HS-ARC-002
    titulo: Existe el registro de decisiones del proyecto
    texto: >-
      La instancia DEBE tener un directorio de decisiones (rol `decisions.dir`) con al menos un
      archivo Markdown (índice o ADR).
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.decisions.exists]
    fuentes: [S-LHE#L05, S-OAI-HE#p6]
    estado: aprobado
    desde: 0.1.0
    retirada: Nunca.

  # ───────────────────────── SEGURIDAD ─────────────────────────
  - id: HS-SEC-001
    titulo: Existe la política de seguridad del repositorio
    texto: La instancia DEBE tener una política de seguridad (rol `security.policy`).
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.security.doc-exists]
    fuentes: [S-OAI-HE, S-MCP]
    nota: Contenido mínimo (amenazas, secretos, acciones que requieren aprobación) en Fase 2/5.
    estado: aprobado
    desde: 0.1.0
    retirada: Nunca.

  - id: HS-SEC-002
    titulo: CODEOWNERS protege la configuración de agentes
    texto: >-
      DEBE existir un archivo CODEOWNERS en una de las ubicaciones que reconoce GitHub y, aplicando
      su semántica (gana el último patrón que coincide), cada ruta sensible de `roles.yaml#rutas_sensibles`
      DEBE tener al menos un propietario.
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [core.codeowners.sensitive-paths]
    fuentes: [S-GH, S-VILA#p29, ADR-013]
    nota: >-
      La exigencia de revisión de code owner en el ruleset (L5) se verifica en la Fase 5; hasta entonces,
      verificación manual del propietario de la instancia.
    estado: aprobado
    desde: 0.1.0
    retirada: Nunca mientras exista configuración de agentes versionada.

  - id: HS-SEC-003
    titulo: Los archivos personales del agente no se versionan (adaptador claude-code)
    texto: >-
      Si el manifiesto declara `claude-code`, `.gitignore` raíz DEBE ignorar `CLAUDE.local.md` y
      `.claude/settings.local.json`.
    nivel: DEBE
    ambito: instancia
    adaptador: claude-code
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [adapter.claude.local-files-ignored]
    fuentes: [S-CC-MEM, S-CC-SET]
    estado: aprobado
    desde: 0.1.0
    retirada: Si Claude Code deja de usar archivos locales en el árbol del proyecto.

  - id: HS-SEC-004
    titulo: No hay secretos versionados
    texto: >-
      El repositorio NO DEBE contener secretos (claves, tokens, contraseñas). Se DEBERÍA activar el
      secret scanning y la push protection de la plataforma.
    nivel: NO DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: enforcement
    verificacion: manual
    verificacion_manual: >-
      Hasta la Fase 5, el propietario confirma que secret scanning y push protection de GitHub están
      activos. En la Fase 5 se añade una regla automática.
    exentable: false
    reglas: []
    fuentes: [S-GH, S-LHE#L12]
    estado: aprobado
    desde: 0.1.0
    retirada: Nunca.

  # ───────────────────────── VERIFICACIÓN / COMANDOS ─────────────────────────
  - id: HS-VER-001
    titulo: El manifiesto declara los comandos obligatorios
    texto: '`commands` DEBE declarar `setup`, `check` y `test` (ADR-006).'
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: false
    reglas: [core.commands.declared]
    fuentes: [S-LHE#L02, S-LHE#L06, ADR-006]
    estado: aprobado
    desde: 0.1.0
    retirada: Nunca.

  - id: HS-VER-002
    titulo: setup y check terminan correctamente sin interacción
    texto: >-
      Ejecutados desde la raíz con la entrada estándar cerrada, `setup` y después `check` DEBEN
      terminar con código 0 en un entorno limpio.
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: true
    reglas: [core.commands.execute]
    fuentes: [S-LHE#L06, S-OAI-HE#p3, ADR-006]
    nota: Solo se evalúa con `harness check --run-commands` (activado por defecto en el workflow reutilizable).
    estado: aprobado
    desde: 0.1.0
    retirada: Nunca.

  - id: HS-VER-003
    titulo: setup es idempotente
    texto: >-
      Ejecutar `setup` dos veces seguidas DEBERÍA terminar con código 0 ambas veces. Es aceptable
      no cumplirlo si `setup` requiere un entorno efímero por diseño, documentado en AGENTS.md.
    nivel: DEBERÍA
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.commands.idempotent]
    fuentes: [ADR-006]
    estado: aprobado
    desde: 0.1.0
    retirada: Nunca.

  # ───────────────────────── NUEVOS EN 0.2.0 (F2.5) ─────────────────────────

  - id: HS-GOV-007
    titulo: El manifiesto declara el idioma de la documentación
    texto: El manifiesto DEBERÍA declarar `project.docs_language` (idioma de los documentos de la instancia).
    nivel: DEBERÍA
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.manifest.docs-language]
    fuentes: [D-020, C-11]
    estado: aprobado
    desde: 0.2.0
    retirada: Si el idioma pasa a ser fijo para toda la organización.

  - id: HS-GOV-008
    titulo: Las rutas versionadas son portables
    texto: Ninguna ruta versionada DEBE contener `:<>"|?*\` ni caracteres de control, ni un segmento que termine en espacio o punto.
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [core.paths.portable]
    fuentes: [R-11, E-008, C-10]
    nota: 'Incidente del 2026-10-20: 171 archivos `*:Zone.Identifier` versionados al copiar desde Windows.'
    estado: aprobado
    desde: 0.2.0
    retirada: Nunca mientras haya personas o agentes trabajando en Windows.

  - id: HS-INS-009
    titulo: AGENTS.md raíz tiene las secciones obligatorias
    texto: AGENTS.md raíz DEBE contener, con contenido, las anclas `harness:resumen`, `harness:comandos`, `harness:restricciones` y `harness:mapa`.
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.instructions.root-anchors]
    fuentes: [S-AGENTSMD, S-OAI-HE#p5, C-01]
    estado: aprobado
    desde: 0.2.0
    retirada: Si la evaluación por ablación (F6) muestra que una sección no aporta.

  - id: HS-INS-010
    titulo: AGENTS.md raíz describe el flujo de trabajo
    texto: 'AGENTS.md raíz DEBERÍA contener el ancla `harness:flujo`: dónde está la tarea, una tarea por rama y PR, y que `done` lo verifica la CI.'
    nivel: DEBERÍA
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.instructions.flow-anchor]
    fuentes: [ADR-005, ADR-016, C-03]
    estado: aprobado
    desde: 0.2.0
    retirada: Si el flujo se carga desde una skill o un hook de inicio de sesión equivalente.

  - id: HS-INS-011
    titulo: Las instrucciones de segmento declaran su ámbito
    texto: Cada `<segmento>/AGENTS.md` DEBE contener `harness:ambito` y al menos otra sección con contenido.
    nivel: DEBE
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.instructions.segment-anchors]
    fuentes: [S-AGENTSMD, C-05]
    estado: aprobado
    desde: 0.2.0
    retirada: Si se sustituyen por `segments.yaml` (N2).

  - id: HS-INS-012
    titulo: Las instrucciones de segmento no duplican la raíz
    texto: Un `<segmento>/AGENTS.md` NO DEBERÍA repetir líneas sustantivas de AGENTS.md raíz.
    nivel: NO DEBERÍA
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.instructions.segment-no-duplication]
    fuentes: [S-CC-MEM, C-06]
    estado: aprobado
    desde: 0.2.0
    retirada: Si los agentes dejan de cargar la raíz junto al segmento.

  - id: HS-INS-013
    titulo: Cada segmento con AGENTS.md tiene su adaptador CLAUDE.md
    texto: Con el adaptador `claude-code`, cada `<segmento>/AGENTS.md` DEBE tener al lado un `<segmento>/CLAUDE.md` que importe `@AGENTS.md`.
    nivel: DEBE
    ambito: instancia
    adaptador: claude-code
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: false
    reglas: [adapter.claude.segment-adapter]
    fuentes: [S-CC-MEM, R-13, C-07]
    nota: Sin él, Claude Code no carga las instrucciones del segmento cuando existe un CLAUDE.md raíz (R-13).
    estado: aprobado
    desde: 0.2.0
    retirada: Si Claude Code carga AGENTS.md de subdirectorios de forma nativa.

  - id: HS-INS-014
    titulo: '@AGENTS.md es la primera línea de cada CLAUDE.md'
    texto: En cada CLAUDE.md versionado, `@AGENTS.md` DEBERÍA ser la primera línea no vacía.
    nivel: DEBERÍA
    ambito: instancia
    adaptador: claude-code
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [adapter.claude.import-first]
    fuentes: [ADR-003, C-08]
    estado: aprobado
    desde: 0.2.0
    retirada: Si el adaptador deja de basarse en imports.

  - id: HS-INS-015
    titulo: El adaptador de Claude Code tiene una sola ubicación
    texto: NO DEBERÍA existir `.claude/CLAUDE.md`; el adaptador raíz es `CLAUDE.md`.
    nivel: NO DEBERÍA
    ambito: instancia
    adaptador: claude-code
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [adapter.claude.single-location]
    fuentes: [S-CC-MEM, C-09]
    estado: aprobado
    desde: 0.2.0
    retirada: Si el estándar adopta `.claude/CLAUDE.md` como ubicación canónica.

  - id: HS-CTX-002
    titulo: Las restricciones duras caben en su presupuesto
    texto: El número de restricciones duras de AGENTS.md raíz DEBERÍA ser como máximo `budgets.instructions_max_constraints` (15 por defecto).
    nivel: DEBERÍA
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.instructions.constraints-budget]
    fuentes: [S-OAI-HE#p5, C-02]
    nota: Valor por defecto ajustable; la evidencia sobre el óptimo es débil.
    estado: aprobado
    desde: 0.2.0
    retirada: Si la ablación (F6) muestra que el número no influye en la adherencia.

  - id: HS-CTX-003
    titulo: La cadena de AGENTS.md cabe en 32 KiB
    texto: La suma de bytes de AGENTS.md raíz más los AGENTS.md de segmento hasta el más profundo DEBERÍA ser como máximo 32 KiB.
    nivel: DEBERÍA
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.instructions.chain-bytes]
    fuentes: [S-CODEX-AGENTSMD, C-04]
    estado: aprobado
    desde: 0.2.0
    retirada: Si Codex cambia `project_doc_max_bytes` o deja de ser un agente soportado.

  - id: HS-CTX-004
    titulo: Las referencias externas indican su procedencia
    texto: Si existe `references.dir`, DEBERÍA tener un README con `harness:indice` y cada archivo DEBERÍA indicar `Fuente:` y fecha de captura y figurar en el índice.
    nivel: DEBERÍA
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.references.provenance]
    fuentes: [S-OAI-HE#p5, C-17]
    estado: aprobado
    desde: 0.2.0
    retirada: Si las referencias se sirven por un MCP con procedencia propia.

  - id: HS-ARC-003
    titulo: El mapa de arquitectura tiene las secciones obligatorias
    texto: El mapa de arquitectura DEBE contener, con contenido, `harness:vision`, `harness:mapa-codigo`, `harness:limites` y `harness:invariantes`.
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.architecture.anchors]
    fuentes: [S-MATKLAD-ARCH, C-12]
    estado: aprobado
    desde: 0.2.0
    retirada: Si la ablación (F6) muestra que una sección no aporta.

  - id: HS-ARC-004
    titulo: El índice de decisiones enumera todos los ADR
    texto: '`decisions.dir/README.md` DEBE contener `harness:indice` y enlazar cada ADR `NNNN-*.md`.'
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.decisions.index]
    fuentes: [S-NYGARD-ADR, C-13]
    estado: aprobado
    desde: 0.2.0
    retirada: Si el índice pasa a generarse.

  - id: HS-ARC-005
    titulo: Cada ADR tiene frontmatter válido
    texto: Cada ADR `NNNN-*.md` DEBE tener frontmatter válido según `schemas/adr.schema.json` con `id` igual a `ADR-NNNN`.
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.decisions.frontmatter]
    fuentes: [S-NYGARD-ADR, C-14]
    estado: aprobado
    desde: 0.2.0
    retirada: Nunca mientras los ADR sean la fuente de decisiones.

  - id: HS-ARC-006
    titulo: Un ADR aceptado no se reescribe
    texto: En un PR, un ADR que en la base está `aceptada` NO DEBERÍA cambiar salvo en `estado` y `reemplazada_por`.
    nivel: NO DEBERÍA
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [pr.adr-immutable]
    fuentes: [S-NYGARD-ADR, C-15]
    nota: 'Se verifica en el PR (`harness pr check`). No distingue correcciones editoriales: aviso, no error.'
    estado: aprobado
    desde: 0.2.0
    retirada: Si se adopta otro modelo de versionado de decisiones.

  - id: HS-SEC-005
    titulo: La política de seguridad tiene las secciones obligatorias
    texto: La política de seguridad DEBE contener, con contenido, `harness:secretos`, `harness:entradas-no-confiables`, `harness:aprobaciones` y `harness:controles`.
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.security.anchors]
    fuentes: [ADR-013, C-16]
    estado: aprobado
    desde: 0.2.0
    retirada: Nunca.

  - id: HS-SEC-006
    titulo: Un PR no oculta que toca rutas sensibles
    texto: 'Un PR que toca rutas de `patrones_sensibles` NO DEBE declarar `sensible: no` y NO DEBERÍA declararse de riesgo `bajo`.'
    nivel: NO DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [pr.sensitive, pr.risk-sensitive]
    fuentes: [ADR-013, C-20]
    nota: Se verifica en el PR (`harness pr check`), check requerido por HS-CI-003.
    estado: aprobado
    desde: 0.2.0
    retirada: Nunca mientras exista configuración de agentes versionada.

  - id: HS-CI-001
    titulo: Existe la plantilla de PR
    texto: Con plataforma `github`, DEBE existir la plantilla de PR (rol `pr.template`) con `harness:tarea`, `harness:riesgo`, `harness:evidencia` y `harness:sensible`.
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.pr.template]
    fuentes: [S-GH-PRTEMPLATE, C-18]
    estado: aprobado
    desde: 0.2.0
    retirada: Si el cuerpo del PR se genera por herramienta.

  - id: HS-CI-002
    titulo: El cuerpo del PR declara tarea y riesgo
    texto: Cada PR DEBE declarar en `harness:tarea` una tarea existente (`T-NNNN`) o `trivial` coherente con el diff (D-023), y en `harness:riesgo` una única clase `bajo`, `medio` o `alto`. Los reverts están exentos de tarea.
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [pr.anchors, pr.task, pr.trivial, pr.risk]
    fuentes: [D-023, C-19]
    nota: Se verifica en el PR (`harness pr check`).
    estado: aprobado
    desde: 0.2.0
    retirada: Si la tarea se vincula al PR por otro mecanismo verificable.

  - id: HS-CI-003
    titulo: El ciclo de vida de tareas es un check requerido
    texto: Un workflow DEBE ejecutar el ciclo de vida de tareas (`harness-tasks-lifecycle.yml` o `harness tasks validate`) en `pull_request`, y el ruleset de la rama principal DEBE exigirlo como check requerido.
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: semiautomatica
    verificacion_manual: Hasta la Fase 5, el propietario de la instancia confirma en el ruleset que `harness tasks` es requerido. La regla solo comprueba que el workflow existe y se dispara en PR.
    exentable: false
    reglas: [core.ci.tasks-workflow]
    fuentes: [ADR-016, E-006, C-26]
    estado: aprobado
    desde: 0.2.0
    retirada: Si `done` deja de escribirse en el repositorio.

  - id: HS-STA-001
    titulo: Existe la estructura de tareas
    texto: La instancia DEBE tener los directorios `plans.dir`, `plans.active` y `plans.completed`.
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.plans.structure]
    fuentes: [ADR-005]
    estado: aprobado
    desde: 0.2.0
    retirada: Si la fuente de verdad de las tareas pasa a un sistema externo (X-01).

  - id: HS-STA-002
    titulo: Cada tarea es válida
    texto: Cada archivo de tarea DEBE validar contra `schemas/task.schema.json`, llamarse `T-NNNN-<slug>.md` con el mismo id, tener id único, contener las secciones obligatorias y depender solo de tareas existentes.
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [tasks.schema, tasks.naming, tasks.unique, tasks.body, tasks.depends]
    fuentes: [ADR-005, C-21]
    estado: aprobado
    desde: 0.2.0
    retirada: Si la fuente de verdad de las tareas pasa a un sistema externo (X-01).

  - id: HS-STA-003
    titulo: Las tareas están en su carpeta y no se borran
    texto: Las tareas terminales DEBEN estar en `plans.completed` y las demás en `plans.active`; ninguna tarea DEBE desaparecer (se cancela).
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [tasks.location, tasks.deleted]
    fuentes: [ADR-005, C-22]
    nota: '`tasks.deleted` se verifica en el PR (`harness tasks validate --base`).'
    estado: aprobado
    desde: 0.2.0
    retirada: Si se adopta una política de archivo aprobada por ADR.

  - id: HS-STA-004
    titulo: Solo hay transiciones de estado permitidas
    texto: Respecto a la base del PR, cada tarea DEBE cambiar de estado solo según las transiciones de la ficha `plans.dir`.
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [tasks.transition]
    fuentes: [ADR-005, C-23]
    nota: Se verifica en el PR (`harness tasks validate --base`).
    estado: aprobado
    desde: 0.2.0
    retirada: Nunca mientras exista el ciclo de vida.

  - id: HS-STA-005
    titulo: done solo con aceptación verificada por la CI
    texto: Una tarea DEBE pasar a `done` solo en un PR cuyo check vuelva a ejecutar con éxito todos sus criterios ejecutables, con `done_pr` igual a ese PR y con cada criterio `manual` verificado (`verified_by`) por alguien que haya aprobado el PR.
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [tasks.acceptance, tasks.done-pr]
    fuentes: [ADR-016, C-24]
    nota: La re-ejecución y los aprobadores se verifican en el PR (`harness tasks validate --base --run-acceptance`).
    estado: aprobado
    desde: 0.2.0
    retirada: 'Nunca: es la definición verificable de terminado.'

  - id: HS-STA-006
    titulo: El índice de tareas está al día
    texto: '`plans.index` DEBERÍA coincidir con la salida de `harness tasks index`.'
    nivel: DEBERÍA
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [tasks.index]
    fuentes: [ADR-005, C-25]
    estado: aprobado
    desde: 0.2.0
    retirada: Si el índice deja de versionarse.

  # ───────────────────────── NUEVOS EN 0.3.0 (F3.3) ─────────────────────────

  - id: HS-CMP-001
    titulo: Las skills cumplen la especificación de Agent Skills
    texto: 'Cada directorio de `.claude/skills/` DEBE contener un `SKILL.md` conforme a agentskills.io/specification: `name` válido e igual al directorio, `description` de 1–1024 caracteres, y `compatibility`, `metadata` y `allowed-tools` con su formato.'
    nivel: DEBE
    ambito: instancia
    adaptador: claude-code
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [adapter.claude.skills-spec]
    fuentes: [S-SKILLS, ADR-012, K-04]
    estado: aprobado
    desde: 0.3.0
    retirada: Si la especificación de Agent Skills cambia de forma incompatible.

  - id: HS-CMP-002
    titulo: Las skills usan solo los campos de su perfil
    texto: 'Una skill DEBERÍA usar solo los campos de Agent Skills (perfil `portable`, por defecto). Las extensiones de Claude Code solo se usan con `metadata.harness-perfil: claude-code`. Los campos desconocidos no se usan.'
    nivel: DEBERÍA
    ambito: instancia
    adaptador: claude-code
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [adapter.claude.skills-profile]
    fuentes: [ADR-012, S-CC-SKILLS, K-04]
    estado: aprobado
    desde: 0.3.0
    retirada: Si todos los adaptadores soportados aceptan las mismas extensiones.

  - id: HS-CMP-003
    titulo: No se versiona .agents/skills en la v1
    texto: La instancia NO DEBERÍA contener `.agents/skills/`. La fuente canónica es `.claude/skills/`, y `.agents/skills/` solo lo genera `harness sync` cuando un adaptador lo necesita.
    nivel: NO DEBERÍA
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.skills.no-agents-dir]
    fuentes: [ADR-012, K-05]
    estado: aprobado
    desde: 0.3.0
    retirada: Cuando exista `harness sync` para un adaptador que lea `.agents/skills/`.

  - id: HS-CMP-004
    titulo: Los subagentes tienen frontmatter válido
    texto: Cada archivo de `.claude/agents/*.md` DEBE tener frontmatter YAML con `name` y `description` no vacíos, y los nombres DEBEN ser únicos.
    nivel: DEBE
    ambito: instancia
    adaptador: claude-code
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [adapter.claude.agents-valid]
    fuentes: [S-CC-SET, K-07]
    estado: aprobado
    desde: 0.3.0
    retirada: Si Claude Code cambia el formato de subagentes.

  - id: HS-CMP-005
    titulo: Los subagentes declaran sus herramientas
    texto: Cada subagente DEBERÍA declarar `tools` de forma explícita (privilegio mínimo). Sin `tools`, hereda todas las herramientas.
    nivel: DEBERÍA
    ambito: instancia
    adaptador: claude-code
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [adapter.claude.agents-tools]
    fuentes: [S-CC-SET, S-OWASP-LLM01, K-07]
    estado: aprobado
    desde: 0.3.0
    retirada: Si Claude Code cambia el valor por defecto a ninguna herramienta.

  - id: HS-CMP-006
    titulo: Los hooks de comando referencian scripts versionados
    texto: Cada hook `command` de `.claude/settings.json` que referencie `${CLAUDE_PROJECT_DIR}/<ruta>` DEBE apuntar a un archivo existente dentro del repositorio.
    nivel: DEBE
    ambito: instancia
    adaptador: claude-code
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [adapter.claude.hooks-scripts]
    fuentes: [S-CC-SET, ADR-013]
    nota: 'Un hook cuyo script falta no se ejecuta y no avisa: la protección desaparece sin que nadie lo note.'
    estado: aprobado
    desde: 0.3.0
    retirada: Si los hooks pasan a distribuirse solo como plugin.

  - id: HS-CMP-007
    titulo: Los hooks no deterministas no se presentan como control
    texto: Si la instancia usa hooks `prompt` o `agent`, la tabla `harness:controles` de la política de seguridad NO DEBE presentarlos como control.
    nivel: NO DEBE
    ambito: instancia
    adaptador: claude-code
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: semiautomatica
    verificacion_manual: La regla avisa si hay hooks prompt o agent y la tabla de controles menciona hooks. El revisor de seguridad confirma que ningún control depende de ellos.
    exentable: true
    reglas: [adapter.claude.hooks-nondeterministic]
    fuentes: [ADR-009, C9, K-06]
    estado: aprobado
    desde: 0.3.0
    retirada: Nunca mientras existan hooks no deterministas.

  - id: HS-CMP-008
    titulo: La versión mínima de Claude Code es la del adaptador
    texto: '`adapters.agents[claude-code].min_version` del manifiesto DEBERÍA ser igual o posterior a la versión mínima del adaptador (2.1.277).'
    nivel: DEBERÍA
    ambito: instancia
    adaptador: claude-code
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [adapter.claude.min-version]
    fuentes: [standard/adaptadores/claude-code.md, K-13]
    estado: aprobado
    desde: 0.3.0
    retirada: Se actualiza con cada revisión del adaptador.

  - id: HS-SEC-007
    titulo: settings.json impide leer y editar .env
    texto: Con el adaptador `claude-code` y N1, DEBE existir `.claude/settings.json` como JSON válido, con `permissions.deny` que impida `Read` y `Edit` de `.env` y `.env.*` a cualquier profundidad.
    nivel: DEBE
    ambito: instancia
    adaptador: claude-code
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [adapter.claude.settings-secrets]
    fuentes: [S-CC-SET, ADR-013, K-09]
    nota: Reduce la exposición accidental. No es un control frente a scripts arbitrarios (H6); los secretos no deben estar en el árbol de trabajo (HS-SEC-004).
    estado: aprobado
    desde: 0.3.0
    retirada: Si la organización lo impone en managed settings para todos los repositorios.

  - id: HS-SEC-008
    titulo: settings.json pide confirmación para editar rutas sensibles
    texto: '`.claude/settings.json` DEBE tener reglas `Edit` en `ask` o `deny` que cubran cada ruta de `rutas_sensibles` de `roles.yaml`.'
    nivel: DEBE
    ambito: instancia
    adaptador: claude-code
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [adapter.claude.settings-sensitive]
    fuentes: [ADR-013, S-CC-SET, K-10]
    estado: aprobado
    desde: 0.3.0
    retirada: Si la organización lo impone en managed settings.

  - id: HS-SEC-009
    titulo: settings.json no habilita modos ni MCP sin control
    texto: '`.claude/settings.json` DEBE fijar `permissions.disableBypassPermissionsMode: "disable"` y NO DEBE contener `enableAllProjectMcpServers: true` ni `defaultMode` `auto` o `bypassPermissions`.'
    nivel: DEBE
    ambito: instancia
    adaptador: claude-code
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [adapter.claude.settings-modes]
    fuentes: [S-CC-SET, S-MCP, K-11]
    estado: aprobado
    desde: 0.3.0
    retirada: Si la organización lo impone en managed settings.

  - id: HS-SEC-010
    titulo: settings.json desactiva el modo automático
    texto: '`.claude/settings.json` DEBE fijar `permissions.disableAutoMode: "disable"`.'
    nivel: DEBE
    ambito: instancia
    adaptador: claude-code
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [adapter.claude.settings-automode]
    fuentes: [S-CC-SET, ADR-009, D-041]
    nota: En modo automático un clasificador decide las confirmaciones en lugar de la persona. Desde el proyecto es protección por defecto, no frontera (un settings.local.json puede anularlo); la frontera es managed settings (F5).
    estado: aprobado
    desde: 0.5.0
    retirada: Si la organización lo impone en managed settings, o si la F5 aprueba el modo automático con evidencia para algún perfil.

  - id: HS-SEC-011
    titulo: settings.json controla gh api y rechaza operaciones de gh sobre repo, secretos, rulesets y sesión
    texto: '`.claude/settings.json` DEBERÍA incluir `Bash(gh api *)` en `permissions.ask` y `Bash(gh repo delete *)`, `Bash(gh secret *)`, `Bash(gh ruleset *)` y `Bash(gh auth *)` en `permissions.deny`.'
    nivel: DEBERÍA
    ambito: instancia
    adaptador: claude-code
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [adapter.claude.settings-gh]
    fuentes: [S-CC-SET, D-042]
    nota: Reducción de riesgo, no frontera. Las reglas Bash no detienen otras formas de invocar el programa (sh -c, rutas absolutas). La frontera es un token de mínimo privilegio y el sandbox (F5).
    estado: aprobado
    desde: 0.5.0
    retirada: Cuando el agente use un token de GitHub de mínimo privilegio que impida estas operaciones (F5).

  - id: HS-SEC-012
    titulo: Las reglas allow no abren intérpretes, red, borrado ni la ejecución del contrato
    texto: 'Las reglas `permissions.allow` de `.claude/settings.json` NO DEBERÍAN permitir sin confirmación intérpretes (`python -c`, `bash -c`, `node -e`…), red (`curl`, `wget`), borrado (`rm`), `git` o `gh` en general, ni `harness … --run-commands` o `--run-acceptance`.'
    nivel: DEBERÍA
    ambito: instancia
    adaptador: claude-code
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [adapter.claude.settings-allow-broad]
    fuentes: [S-CC-SET, D-043]
    nota: Permitir los comandos check o test de una instancia es ejecutar sin confirmación código escrito por el agente. Es una decisión de cada instancia, preferiblemente con sandbox (adaptador §3).
    estado: aprobado
    desde: 0.5.0
    retirada: Si el sandbox de la F5 se vuelve obligatorio y hace innecesario acotar las reglas allow.

  - id: HS-CI-004
    titulo: El agente en CI no carga la configuración del repositorio
    texto: Un paso de workflow que ejecute `claude -p` DEBE usar `--bare` y `--setting-sources user`, con su configuración tomada de fuera del PR.
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [core.ci.agent-bare]
    fuentes: [R-14, S-CC-SET, K-12]
    nota: 'No cubre `anthropics/claude-code-action`: sus opciones se verificarán en F5.'
    estado: aprobado
    desde: 0.3.0
    retirada: Si Claude Code deja de cargar en `-p` la configuración de proyectos no confiables.


  - id: HS-CI-005
    titulo: La clase de riesgo declarada no es menor que la calculada
    texto: 'El riesgo declarado en el PR DEBE ser mayor o igual que la clase mínima que calcula `harness pr risk` a partir del diff y de las tareas que el PR cierra: `alto` si toca rutas críticas (workflows, CODEOWNERS, `.harness/` y las que añada el manifiesto en `riesgo.rutas_criticas`) o cierra una tarea de riesgo alto; `medio` si toca configuración de agentes, borra o renombra pruebas o cambia los criterios de aceptación de una tarea que cierra; `bajo` en otro caso.'
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [pr.risk-min]
    fuentes: [ADR-010, D-058, K-14]
    nota: La clase `alto` activa la puerta explícita del workflow de tareas (ADR-010 rev. 2). Declarar puede subir la clase, nunca bajarla.
    estado: aprobado
    desde: 0.6.0
    retirada: Si la plataforma ofrece una clasificación de riesgo equivalente y comprobable.

  - id: HS-CI-006
    titulo: La configuración real de la plataforma se comprueba de forma periódica
    texto: 'La instancia DEBE ejecutar `harness platform check` al menos semanalmente y en cada push a la rama por defecto, y DEBE corregir los fallos: PR obligatorio (N1+), checks requeridos del nivel, sin force push ni borrado, environment de la puerta de riesgo alto con revisores (0.6.0+) y, en N2+, aprobaciones, Code Owners y aprobación del último push por otra persona.'
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: semiautomatica
    verificacion_manual: Que el workflow programado `harness-platform.yml` está activo y que sus fallos se corrigen (la issue «harness platform check falla» no queda abierta).
    exentable: false
    reglas: [platform.reachable, platform.pull-request, platform.required-checks, platform.no-force-push, platform.no-deletion, platform.approvals, platform.gate-environment, platform.deploy-environment]
    fuentes: [ADR-010, D-062, F5-01]
    nota: Solo lee la API de GitHub (sin token en repositorios públicos). No se ejecuta en los PR. La plantilla N1 incluye el workflow programado `harness-platform.yml`.
    estado: aprobado
    desde: 0.7.0
    retirada: Si la plataforma se gestiona como código con verificación equivalente (p. ej. IaC con plan en CI).

  - id: HS-CI-007
    titulo: Los workflows no abren vías de ejecución con privilegios
    texto: 'Los workflows de la instancia NO DEBEN usar `pull_request_target` (salvo waiver con ADR), NO DEBEN interpolar datos del evento controlados por terceros en `run:` o `script:`, DEBEN declarar `permissions:` de nivel superior sin escritura global, y un job con credenciales del modelo NO DEBE tener permisos de escritura (salvo `id-token`).'
    nivel: DEBE
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: enforcement
    verificacion: automatica
    exentable: true
    reglas: [ci.no-pr-target, ci.no-untrusted-interpolation, ci.permissions, ci.model-readonly]
    fuentes: [ADR-013, D-063, F5-01]
    nota: Reglas estáticas sobre el YAML; reducen el riesgo de V2, V3 y V12, no son prueba formal. Linters externos (zizmor, actionlint) son un complemento opcional.
    estado: aprobado
    desde: 0.7.0
    retirada: Si GitHub impone estas restricciones por política de organización comprobable.

  - id: HS-CI-008
    titulo: Dependencias de workflows fijadas y compatibles con merge queue
    texto: 'Las actions y workflows reutilizables de terceros DEBERÍAN fijarse a un SHA completo (los del estándar, a un tag `cli-v…`) y los workflows que se ejecutan en `pull_request` DEBERÍAN ejecutarse también en `merge_group`.'
    nivel: DEBERÍA
    ambito: instancia
    conformidad: [N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [ci.pinned, ci.merge-group]
    fuentes: [D-063, F5-01]
    estado: aprobado
    desde: 0.7.0
    retirada: Si se adoptan los lockfiles de dependencias de workflows de GitHub (pendiente de verificar su formato).
  - id: HS-CMP-010
    titulo: Las entradas del catálogo son válidas y coherentes
    texto: Cada componente del catálogo central DEBE tener `componente.yaml` válido contra `schemas/catalog-entry.schema.json`, con `id` y `tipo` iguales a su ruta `catalog/<tipo>/<id>/` y con archivos de origen existentes.
    nivel: DEBE
    ambito: estandar
    conformidad: []
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [catalog.entry]
    fuentes: [05-componentes, K-01, K-02]
    nota: Lo verifica `harness catalog validate` en la CI del repositorio central.
    estado: aprobado
    desde: 0.3.0
    retirada: Si el catálogo deja de existir como repositorio versionado.

  - id: HS-CMP-011
    titulo: Cada componente tiene ficha de 17 puntos
    texto: Cada componente del catálogo DEBE tener `FICHA.md` con los 17 apartados de la plantilla.
    nivel: DEBE
    ambito: estandar
    conformidad: []
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [catalog.ficha]
    fuentes: [Encargo (plantilla obligatoria), K-01]
    nota: Lo verifica `harness catalog validate` en la CI del repositorio central.
    estado: aprobado
    desde: 0.3.0
    retirada: Si el catálogo deja de existir como repositorio versionado.

  - id: HS-CMP-012
    titulo: Las skills del catálogo cumplen su especificación y perfil
    texto: Cada skill del catálogo DEBE instalar un `SKILL.md` conforme a Agent Skills, con `name` igual al `id`, perfil igual al de la entrada y destino `.claude/skills/<id>/SKILL.md`.
    nivel: DEBE
    ambito: estandar
    conformidad: []
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [catalog.skill]
    fuentes: [ADR-012, S-SKILLS]
    nota: Lo verifica `harness catalog validate` en la CI del repositorio central.
    estado: aprobado
    desde: 0.3.0
    retirada: Si el catálogo deja de existir como repositorio versionado.

  - id: HS-CMP-013
    titulo: El ciclo de vida y la versión de los componentes son coherentes
    texto: En un PR, el estado de un componente DEBE cambiar solo según `experimental → estable → deprecado → retirado` (o `experimental → retirado`), y un componente cuyos archivos cambian DEBE subir su `version`.
    nivel: DEBE
    ambito: estandar
    conformidad: []
    naturaleza: enforcement
    verificacion: automatica
    exentable: false
    reglas: [catalog.transition, catalog.version]
    fuentes: [05-componentes §5, K-03]
    nota: Lo verifica `harness catalog validate` en la CI del repositorio central.
    estado: aprobado
    desde: 0.3.0
    retirada: Si el catálogo deja de existir como repositorio versionado.

  # ───────────────────────── NUEVOS EN 0.4.0 (F3.5) ─────────────────────────

  - id: HS-CMP-009
    titulo: Los componentes instalados no tienen deriva
    texto: 'Si existe `.harness/components.lock`, cada componente registrado DEBERÍA estar instalado sin cambios locales: sus archivos existen con el SHA-256 registrado y su fragmento de configuración sigue en `.claude/settings.json`.'
    nivel: DEBERÍA
    ambito: instancia
    conformidad: [N0, N1, N2, N3]
    naturaleza: guidance
    verificacion: automatica
    exentable: true
    reglas: [core.components.drift]
    fuentes: [ADR-017, K-08]
    nota: Un componente modificado en local deja de ser el del catálogo. Se restaura o se convierte en un componente propio con otro id.
    estado: aprobado
    desde: 0.4.0
    retirada: Si la distribución deja de hacerse por copia (ADR-017).
