# Autoridad comprobable (HS-CI-006): comprueba que el ruleset y los environments reales cumplen el nivel.
# Programado y en cada push a la rama por defecto; NO es un check de PR. Si falla, abre o comenta una issue.
name: harness-platform
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    uses: {{STANDARD_REPO}}/.github/workflows/harness-platform.yml@{{CLI_REF}}
    with:
      standard-repository: {{STANDARD_REPO}}
      cli-ref: {{CLI_REF}}
    permissions:
      contents: read
      actions: read
      issues: write
