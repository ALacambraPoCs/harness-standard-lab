# Ciclo de vida de tareas (N1): valida tareas y PR, verifica la aceptación de las tareas que pasan a done
# (ADR-016) y refleja el estado en las issues enlazadas (X-01). Marca como checks requeridos
# "tasks / harness tasks" y "tasks / puerta riesgo alto" (se salta salvo en riesgo alto, ADR-010 rev. 2).
name: harness-tasks
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tasks:
    uses: {{STANDARD_REPO}}/.github/workflows/harness-tasks-lifecycle.yml@{{CLI_REF}}
    with:
      standard-repository: {{STANDARD_REPO}}
      cli-ref: {{CLI_REF}}
    permissions:
      contents: read
      pull-requests: read
      issues: write
