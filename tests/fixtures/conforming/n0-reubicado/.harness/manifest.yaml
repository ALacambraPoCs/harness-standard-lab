# Instancia brownfield: conserva sus rutas y declara las desviaciones (ADR-004).
standard:
  version: 0.1.0
  level: N0
project:
  name: ejemplo-reubicado
  owner: "@org/equipo-legacy"
  kind: application
adapters:
  agents:
    - id: claude-code
      min_version: 2.1.277
  platform:
    id: github
commands:
  setup: python3 scripts/setup.py
  check: python3 -m py_compile src/app.py
  test: python3 -m unittest discover -s tests
roles:
  architecture.map: docs/ARCHITECTURE.md
  decisions.dir: docs/adr
  security.policy: SECURITY.md
waivers:
  - requirement: HS-INS-008
    reason: El índice de AGENTS.md se reescribirá al migrar la wiki (tarea T-0007).
    approved_by: "@lider-tecnico"
    approved_on: 2026-10-01
    expires: 2026-12-15
